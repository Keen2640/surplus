[project]
name = "surplus"
version = "0.1.0"
description = "Pension liability-driven investing (LDI) engine: Treasury curve, liability key-rate risk, hedge optimizer, Hull-White funded-status simulation, and a Claude-powered analyst."
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.13", "fastapi>=0.110", "uvicorn>=0.29", "anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["surplus"]
